<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="gradium logo.png">
  <title>Teacher Dashboard</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    .tab { cursor: pointer; padding: 6px; background: #eee; display: inline-block; margin-right: 5px; }
    .active { background: #ccc; }
    .tab-content { display: none; margin-top: 20px; }
    .tab-content.active { display: block; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #000; padding: 5px; }
    input, button, select { margin: 5px 0; padding: 6px; }
  </style>
</head>

<body>
<div class="header">
  <img src="gradium logo-Picsart-BackgroundRemover.png" alt="Logo" class="logo">
  <h1>Teacher Dashboard</h1>
</div>
<button type="button" onclick="logout()">Logout</button>
<div id="loading">Loading auth...</div>
<div id="app" style="display:none;">

  <!-- ================= TABS ================= -->
  <div>
    <span class="tab active" data-tab="assignment">Assignment & Rubric</span>
    <span class="tab" data-tab="gradebook">Gradebook</span>
    <span class="tab" data-tab="flags">Flags</span>
    <span class="tab" data-tab="classes">Class Management</span>
  </div>

  <!-- ================= ASSIGNMENT ================= -->
  <div id="assignment" class="tab-content active">
    <h2>Create Assignment + Upload Files</h2>

    <input type="text" id="assignment_id" placeholder="Assignment ID"><br>

    <select id="assignmentClassId">
      <option>Click Load Classes</option>
    </select><br>

    <button type="button" id="loadClassesBtn">Load Classes</button><br><br>

    <hr>

    <label>Rubric File:</label><br>
    <input type="file" id="rubricFile"><br>

    <label>Assignment File:</label><br>
    <input type="file" id="assignmentFile"><br>

    <br>

    <!-- ISOLATED ACTION BUTTONS -->
    <button type="button" id="createAssignmentBtn">Create Assignment</button>
    <button type="button" id="uploadRubricBtn">Upload Rubric</button>
    <button type="button" id="uploadAssignmentBtn">Upload Assignment File</button>
    <button type="button" id="resetAssignmentBtn">Reset Assignment</button>
    <div id="assignmentResponse"></div>
  </div>

  <!-- ================= OTHER TABS ================= -->
  <!-- GRADEBOOK -->
  <div id="gradebook" class="tab-content">
    <h2>Gradebook</h2>
    <button id="loadGrades">Load Gradebook</button>

    <table id="gradebookTable">
      <tr>
        <th>Student Email</th>
        <th>Class Name</th>
        <th>Average</th>
      </tr>
    </table>
  </div>

  <!-- FLAGS -->
  <div id="flags" class="tab-content">
    <h2>Flags</h2>
    <button id="loadFlags">Load Flags</button>

    <table id="flagsTable">
      <tr>
        <th>Student</th>
        <th>Class</th>
        <th>Assignment</th>
        <th>Flag Reason</th>
      </tr>
    </table>
  </div>

  <!-- CLASS MANAGEMENT -->
<div id="classes" class="tab-content">
  <h2>Class Management</h2>

  <form id="createClassForm">
    <input type="text" id="classId" placeholder="Class ID"><br>
    <input type="text" id="className" placeholder="Class Name"><br>
    <button>Create Class</button>
  </form>

  <hr>

  <!-- 🔥 NEW: STUDENT DROPDOWN -->
  <div>
    <button type="button" id="loadStudentsBtn">Load Students</button><br>

    <select id="studentSelect">
      <option>Load students first</option>
    </select>
  </div>

  <br>

    <!-- 🔥 NEW BUTTON -->
  <button type="button" id="loadClassesForAssignBtn">
    Load Classes
  </button>


  <!-- ASSIGN STUDENT -->
  <form id="assignStudentForm">
    <select id="assignClassId">
      <option>Load classes first</option>
    </select><br>

    <button>Assign Student</button>
  </form>

  <div id="classResponse"></div>
</div>

  <!-- ASSIGNMENT -->
  <div id="assignment" class="tab-content">
    <h2>Make Assignment</h2>

    <form id="makeAssignmentForm">
      <input type="text" id="assignmentTitle" placeholder="Title" required><br>
      <select id="assignmentClassId" required></select><br>
      <button>Create</button>
    </form>

    <div id="assignmentResponse"></div>
  </div>

</div>


</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDEEc-ioIzOyw5CWHQlC4wCZRSXWCQDaX0",
  authDomain: "ai-grader-5a3e0.firebaseapp.com",
  projectId: "ai-grader-5a3e0",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

let currentUser = null;
const BASE = "https://nicocolosimo.app.n8n.cloud/webhook/secure-webhook";

/* IMPORTANT FIX */
let currentAssignmentId = null;

/* ================= AUTH ================= */
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
});

/* ================= LOGOUT ================= */
function logout() {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  }).catch(err => {
    console.error("Logout error:", err);
  });
}

/* ================= TABS ================= */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

/* ================= TOKEN ================= */
async function getToken() {
  return await currentUser.getIdToken();
}

/* ================= LOAD CLASSES ================= */
async function loadClasses(targetDropdownId) {
  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "class_dropdown",
      teacher_uid: currentUser.uid
    })
  });

  const data = await res.json();

  let classes = Array.isArray(data) ? data :
                Array.isArray(data.rows) ? data.rows :
                data.class_id ? [data] : [];

  const dropdown = document.getElementById(targetDropdownId);
  dropdown.innerHTML = "";

  if (!classes.length) {
    dropdown.innerHTML = "<option>No classes found</option>";
    return;
  }

  classes.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.class_id;
    opt.textContent = c.class_name || c.class_id;
    dropdown.appendChild(opt);
  });
}

/* ================= BUTTONS ================= */
document.getElementById("loadClassesBtn").addEventListener("click", () =>
  loadClasses("assignmentClassId")
);



/* ================= CREATE ASSIGNMENT ================= */
document.getElementById("createAssignmentBtn").addEventListener("click", async () => {
  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "create_assignment",
      assignment_id: document.getElementById("assignment_id").value,
      class_id: document.getElementById("assignmentClassId").value,
      teacher_uid: currentUser.uid
    })
  });

  const text = await res.text();
  console.log("CREATE RESPONSE:", text);

  let data = {};
  try {
    data = JSON.parse(text);
  } catch {
    console.warn("Non-JSON response from n8n");
  }

  currentAssignmentId =
    data.assignment_id ||
    data.id ||
    text.match(/([a-zA-Z0-9_-]{6,})/)?.[1] ||
    null;
  currentAssignmentId = data.assignmentId || data.id || null;
  currentAssignmentKey = data.assignment_key || null;

  document.getElementById("assignmentResponse").innerText =
  currentAssignmentKey
    ? "Assignment_KEY: " + currentAssignmentKey
    : (currentAssignmentId
        ? "Assignment_ID: " + currentAssignmentId
        : "Warning: No assignment returned");
});

/* ================= UPLOAD RUBRIC ================= */
document.getElementById("uploadRubricBtn").addEventListener("click", async () => {
  const token = await getToken();
  const file = document.getElementById("rubricFile").files[0];

  if (!file) return alert("Select rubric file");

  const assignmentId =
    currentAssignmentId ||
    document.getElementById("assignment_id").value;

  if (!assignmentId) {
    alert("No Assignment ID found. Create assignment first.");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("assignment_id", assignmentId);

  const res = await fetch("https://nicocolosimo.app.n8n.cloud/webhook/upload-rubric", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token
    },
    body: formData
  });

  console.log("RUBRIC RESPONSE:", await res.text());
});

/* ================= UPLOAD ASSIGNMENT FILE ================= */
document.getElementById("uploadAssignmentBtn").addEventListener("click", async () => {
  const token = await getToken();
  const file = document.getElementById("assignmentFile").files[0];

  if (!file) return alert("Select assignment file");

  const assignmentId =
    currentAssignmentId ||
    document.getElementById("assignment_id").value;

  if (!assignmentId) {
    alert("No Assignment ID found. Create assignment first.");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("assignment_id", assignmentId);

  const res = await fetch("https://nicocolosimo.app.n8n.cloud/webhook/upload-assignment-file", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token
    },
    body: formData
  });

  console.log("ASSIGNMENT RESPONSE:", await res.text());
});
/* ================= RESET ASSIGNMENT ================= */
document.getElementById("resetAssignmentBtn").addEventListener("click", () => {
  currentAssignmentId = null;

  // clear UI fields
  document.getElementById("assignment_id").value = "";

  document.getElementById("rubricFile").value = "";
  document.getElementById("assignmentFile").value = "";

  document.getElementById("assignmentClassId").selectedIndex = 0;

  // clear output text
  document.getElementById("assignmentResponse").innerText = "";

  console.log("Assignment reset complete");
});

/* ================= LOAD CLASSES (DROPDOWN) ================= */
async function loadClassDropdown() {
  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "class_dropdown",
      teacher_uid: currentUser.uid
    })
  });

  const data = await res.json();

  let classes = [];
  if (Array.isArray(data)) classes = data;
  else if (Array.isArray(data.rows)) classes = data.rows;
  else if (data.class_id) classes = [data];

  const dropdown = document.getElementById("assignmentClassId");
  dropdown.innerHTML = "";

  if (!classes.length) {
    dropdown.innerHTML = "<option>No classes found</option>";
    return;
  }

  classes.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.class_id;
    opt.textContent = c.class_name || c.class_id;
    dropdown.appendChild(opt);
  });
}

/* ================= FLAGS ================= */
document.getElementById("loadFlags")?.addEventListener("click", async () => {
  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + await getToken()
    },
    body: JSON.stringify({
      action: "get_flags",
      teacher_uid: currentUser.uid
    })
  });

  const data = await res.json();
  console.log("FLAGS RAW:", data);

  // 🔥 normalize response (handles ALL formats)
  const flags = Array.isArray(data)
    ? data
    : (data.flags || data.rows || data.data || [data]);

  const table = document.getElementById("flagsTable");

  table.innerHTML = `
    <tr>
      <th>Student</th>
      <th>Class</th>
      <th>Assignment</th>
      <th>Flag Reason</th>
    </tr>
  `;

  if (!flags.length) return;

  flags.forEach(f => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${f.student_email ?? "N/A"}</td>
      <td>${f.class_name ?? "N/A"}</td>
      <td>${f.assignment_id ?? "N/A"}</td>
      <td>${f.flag_reason ?? "N/A"}</td>
    `;

    table.appendChild(row);
  });
});

/* ================= CREATE CLASS ================= */
document.getElementById("createClassForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "create_class",
      teacher_uid: currentUser.uid,
      data: {
        class_id: document.getElementById("classId").value,
        class_name: document.getElementById("className").value
      }
    })
  });

  const data = await res.json();
  document.getElementById("classResponse").innerText = data.message;
});
/* ================= ASSIGN STUDENT ================= */
document.getElementById("assignStudentForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "assign_student",
      teacher_uid: currentUser.uid,
      data: {
        uid: document.getElementById("studentUid").value,
        class_id: document.getElementById("assignClassId").value
      }
    })
  });

  const data = await res.json();
  document.getElementById("classResponse").innerText = data.message;
});

// GRadebook load (teacher view)
document.getElementById("loadGrades")?.addEventListener("click", async () => {
  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + await getToken()
    },
    body: JSON.stringify({
      action: "view_teacher",
      teacher_uid: currentUser.uid
    })
  });

  const data = await res.json();
  console.log("GRADEBOOK RAW:", data);

  const rows = Array.isArray(data) ? data : [data];

  const table = document.getElementById("gradebookTable");

  table.innerHTML = `
    <tr>
      <th>Student Email</th>
      <th>Class Name</th>
      <th>Average</th>
    </tr>
  `;

  rows.forEach(r => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${r.student_email ?? "N/A"}</td>
      <td>${r.class_name ?? "N/A"}</td>
      <td>${r.average ?? "N/A"}</td>
    `;

    table.appendChild(row);
  });
});

// 🔥 LOAD STUDENTS (NEW ACTION)
document.getElementById("loadStudentsBtn")?.addEventListener("click", async () => {
  try {
    const res = await fetch(BASE, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + await getToken()
      },
      body: JSON.stringify({
        action: "get_students",
        teacher_uid: currentUser.uid
      })
    });

    const data = await res.json();
    console.log("STUDENTS RAW:", data);

    // ✅ FIX: force array no matter what
    const students = Array.isArray(data)
      ? data
      : (data.uid ? [data] : []);

    const dropdown = document.getElementById("studentSelect");
    const uidInput = document.getElementById("studentUid");

    dropdown.innerHTML = "";

    if (!students.length) {
      dropdown.innerHTML = "<option>No students found</option>";
      return;
    }

    students.forEach(s => {
      const opt = document.createElement("option");

      opt.value = s.uid;         // hidden UID
      opt.textContent = s.email; // visible email

      dropdown.appendChild(opt);
    });

    dropdown.onchange = () => {
      uidInput.value = dropdown.value;
    };

  } catch (err) {
    console.error("Student load failed:", err);
  }
});

// <!-- 🔥 NEW: LOAD CLASSES FOR ASSIGNING STUDENTS -->
document.getElementById("loadClassesForAssignBtn")?.addEventListener("click", async () => {
  const token = await getToken();

  const res = await fetch(BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      action: "class_dropdown",
      teacher_uid: currentUser.uid
    })
  });

  const data = await res.json();

  let classes = Array.isArray(data) ? data :
                Array.isArray(data.rows) ? data.rows :
                data.class_id ? [data] : [];

  const dropdown = document.getElementById("assignClassId");
  dropdown.innerHTML = "";

  if (!classes.length) {
    dropdown.innerHTML = "<option>No classes found</option>";
    return;
  }

  classes.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.class_id;
    opt.textContent = c.class_name || c.class_id;
    dropdown.appendChild(opt);
  });
});
</script>

</body>
</html>
